[project]
name = "neo-v2"
version = "0.1.0"
description = "Board Meeting Intelligence Platform for HCC Trustees — v2"
readme = "README.md"
requires-python = ">=3.11"

# ── Phase 0 core — install these first, always ───────────────────────────────
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "tqdm>=4.66",
    "qdrant-client>=1.17.1",
    "fastembed>=0.8.0",
    "sentence-transformers>=5.3.0",
]

# ── Optional groups — install per phase with: uv sync --extra <group> ────────

[project.optional-dependencies]

# Phase 1-3: video collection + captions
collection = [
    "yt-dlp>=2024.1",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "youtube-transcript-api>=0.6.2",   # caption download without video format resolution
]

# Phase 4: WhisperX ASR  (NOTE: whisperx must be installed from GitHub)
#   uv pip install git+https://github.com/m-bain/whisperX.git
#   uv pip install pyannote.audio  (requires HuggingFace token acceptance)
asr = [
    "torch>=2.2",
    "torchaudio>=2.2",
    # whisperx and pyannote installed manually — see PHASE4_SETUP.md
]

# Phase 5: transcript cleaning + chunking
cleaning = [
    "spacy>=3.7",      # also run: uv run python -m spacy download en_core_web_sm
    "tiktoken>=0.6",
]

# Phase 6: structured extraction (Ollama client only — Ollama itself is a separate install)
extraction = [
    "ollama>=0.2",
]

# Phase 8-9: Qdrant vector DB + embeddings + reranking
vector = [
    "qdrant-client>=1.9",
    "fastembed>=0.2",   # BM25 sparse vectors
    # BGE reranker loaded via sentence-transformers:
    "sentence-transformers>=2.7",
]

# Phase 10: Claude API (RAG answer generation)
llm = [
    "anthropic>=0.28",
]

# Phase 11: FastAPI extras (already in core, this adds data layer)
api = [
    "pandas>=2.2",
    "python-multipart>=0.0.9",  # file upload support
]

# Phase 12: Streamlit UI
ui = [
    "streamlit>=1.35",
    "python-docx>=1.1",
    "reportlab>=4.1",
]

# Phase 13: Prefect orchestration
orchestration = [
    "prefect>=2.19",
]

# Phase 14: observability
observability = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "arize-phoenix>=4.0",
]

# Install everything at once (not recommended — use groups above)
all = [
    "neo-v2[collection,cleaning,extraction,vector,llm,api,ui,orchestration,observability]",
]

[dependency-groups]
dev = [
    "ipython>=8.0",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = []

# Pin torch* to the CUDA 12.8 wheel channel so any reinstall (uv sync, uv pip
# install of a torch-dependent package, etc.) pulls the matching CUDA build
# instead of PyPI's default CPU build. Without this we keep getting
# torch+cpu/torchvision+cu128 mismatches that break sentence-transformers.
[tool.uv.sources]
torch       = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio  = { index = "pytorch-cu128" }

[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "rag",
    "pipeline",
    "database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"